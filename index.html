<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#24382e">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pantry Pal</title>
<style>
:root{--green:#24382e;--green2:#314c3b;--sage:#e6eedf;--paper:#f7f6f2;--ink:#26372d;--muted:#718072;--line:#e5e5dd;--white:#fff;--peach:#f3e5d5}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input{font:inherit}button{cursor:pointer;border:0}header{background:var(--green);color:white;padding:18px 18px 20px;position:sticky;top:0;z-index:5;box-shadow:0 3px 12px #17271c22}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:14px;background:#d9e8cb;display:grid;place-items:center;font-size:25px}.brand h1{font-size:21px;margin:0}.brand p{margin:0;color:#d9e8cb;font-size:13px}.hero{margin-top:20px}.hero h2{font-size:25px;margin:0 0 4px}.hero p{margin:0;color:#d9e8cb;font-size:14px}.tabs{display:flex;background:white;padding:8px;gap:8px;position:sticky;top:105px;z-index:4;border-bottom:1px solid var(--line)}.tab{flex:1;padding:12px;border-radius:12px;background:white;color:var(--green2);font-weight:650}.tab.active{background:var(--sage)}main{padding:16px;max-width:850px;margin:auto}.search{display:flex;gap:8px;align-items:center;background:white;border:1px solid var(--line);border-radius:14px;padding:0 12px;margin-bottom:12px}.search input{width:100%;border:0;outline:0;padding:14px 0;background:transparent}.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 14px}.chip{border:1px solid var(--line);background:white;color:#445347;border-radius:99px;padding:8px 14px;white-space:nowrap;font-size:13px}.chip.active{background:var(--green2);color:white;border-color:var(--green2)}.section-title{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px}.section-title h3{margin:0;font-size:19px}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:white;border:1px solid var(--line);border-radius:18px;overflow:hidden}.food-art{height:116px;display:grid;place-items:center;font-size:52px;background:var(--peach)}.card-body{padding:12px}.card h3{font-size:15px;line-height:1.3;margin:0 0 7px}.meta{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px;margin:8px 0}.btn{background:var(--green2);color:white;border-radius:12px;padding:12px 14px;font-weight:650}.btn.full{width:100%}.btn.secondary{background:white;color:var(--green2);border:1px solid var(--line)}.btn.danger{background:#fff0ed;color:#9e3e31}.heart{background:transparent;color:#a44d47;font-size:22px;padding:0 3px}.back{background:transparent;color:var(--green2);padding:4px 0 12px;font-weight:650}.detail-art{border-radius:20px;padding:25px;text-align:center;background:var(--peach);margin-bottom:14px}.detail-art .emoji{font-size:55px}.detail-art h2{margin:8px 0;font-size:23px}.detail-art p{margin:0;color:#5e6558}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.panel h3{margin:0 0 12px;font-size:19px}.serving{display:flex;align-items:center;gap:12px}.serving button{background:var(--sage);color:var(--green2);border-radius:50%;width:34px;height:34px;font-weight:700;font-size:19px}.ingredient{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f0eb}.ingredient:last-child{border:0}.ingredient input,.shoprow input{accent-color:var(--green2);width:19px;height:19px}.ingredient label{flex:1}.steps{display:flex;gap:12px;padding:10px 0;border-radius:10px}.stepnum{width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:var(--sage);display:grid;place-items:center;color:var(--green2);font-weight:700}.steps.done{background:#eff4eb}.steps.done .stepnum{background:var(--green2);color:white}.steps.done p{text-decoration:line-through;color:var(--muted)}.steps p{margin:2px 0;flex:1}.empty{text-align:center;padding:40px 20px;color:var(--muted)}.empty .big{font-size:48px}.addrow{display:flex;gap:8px;margin:12px 0}.addrow input{min-width:0;flex:1;padding:12px;border:1px solid var(--line);border-radius:12px;background:white}.progress{height:6px;border-radius:20px;background:#cfd8ca;overflow:hidden;margin-top:12px}.progress span{height:100%;display:block;background:var(--green2);width:0}.shoprow{display:flex;align-items:center;gap:10px;padding:13px;background:white;border:1px solid var(--line);border-radius:13px;margin:8px 0}.shoprow label{flex:1}.shoprow.done label{text-decoration:line-through;color:var(--muted)}.xbtn{background:transparent;color:#899188;font-size:20px}.source{font-size:11px;color:var(--muted);text-align:center;padding:22px 0 8px}.money{font-variant-numeric:tabular-nums;font-weight:700}.price-input{width:110px;border:1px solid var(--line);border-radius:9px;padding:8px;text-align:right}.budget-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:white;border:1px solid var(--line);border-radius:14px;padding:14px}.stat b{font-size:21px;display:block;margin-top:5px}.price-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f0eb}.price-row label{flex:1}.smallnote{font-size:12px;color:var(--muted)}@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.food-art{height:140px}header{padding-left:max(18px,calc((100% - 850px)/2));padding-right:max(18px,calc((100% - 850px)/2))}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">🍲</div><div><h1>Pantry Pal</h1><p>Your meals, made simple.</p></div></div><div class="hero"><h2 id="heroTitle">What are we cooking?</h2><p id="heroSub">Find your next favorite meal.</p></div></header>
<nav class="tabs"><button class="tab active" id="recipesTab" onclick="showTab('recipes')">▤ Recipes</button><button class="tab" id="shoppingTab" onclick="showTab('shopping')">🛒 Shopping <span id="shopCount"></span></button><button class="tab" id="budgetTab" onclick="showTab('budget')">💰 Budget</button></nav>
<main id="app"></main>
<script>
const recipes=[
{id:1,name:"Creamy Garlic Chicken Pasta",category:"Dinner",time:25,base:2,emoji:"🍝",color:"#f3e5d5",description:"Creamy garlic sauce, juicy chicken and parmesan.",ingredients:[["Chicken breast",300,"g"],["Pasta",200,"g"],["Cooking cream",200,"ml"],["Parmesan",60,"g"],["Garlic cloves",3,""],["Butter",20,"g"],["Salt and pepper",1,"pinch"]],steps:["Cut the chicken into bite-sized pieces. Season with salt and pepper.","Boil the pasta in salted water according to the package instructions. Save a little pasta water.","Melt the butter in a pan. Cook the chicken for 6–8 minutes until cooked through.","Add minced garlic and cook for 30 seconds. Pour in the cooking cream and simmer for 2–3 minutes.","Stir in grated parmesan. Add a splash of pasta water if the sauce is too thick.","Mix in the pasta, coat everything in sauce, and serve with extra parmesan."]},
{id:2,name:"Cheesy Chicken Rice",category:"Lunch",time:30,base:2,emoji:"🧀",color:"#f4e8c9",description:"A filling, cheesy one-pan meal for busy days.",ingredients:[["Chicken breast",300,"g"],["Rice",160,"g"],["Grated cheese",120,"g"],["Chicken stock",400,"ml"],["Cooking cream",100,"ml"],["Onion",1,""],["Cooking oil",1,"tbsp"]],steps:["Dice the chicken and finely chop the onion.","Heat the oil in a deep pan and cook the chicken until lightly golden.","Add the onion and cook for 2 minutes.","Stir in the uncooked rice and chicken stock. Cover and simmer until the rice is tender, about 15–18 minutes.","Stir in the cream and grated cheese until melted. Add a little water if needed.","Season to taste and serve hot."]},
{id:3,name:"Loaded Beef Burgers",category:"Dinner",time:25,base:2,emoji:"🍔",color:"#f1ddce",description:"Homemade juicy burgers with melted cheese.",ingredients:[["Ground beef",300,"g"],["Burger buns",2,""],["Cheddar cheese",4,"slices"],["Lettuce",2,"leaves"],["Tomato",1,""],["Burger sauce",40,"g"],["Salt and pepper",1,"pinch"]],steps:["Divide the beef into two patties and season both sides.","Heat a pan over medium-high heat. Cook the patties for about 3–5 minutes per side, depending on thickness and desired doneness.","Add cheese in the final minute and let it melt. Cook ground beef to a safe internal temperature of 71°C.","Lightly toast the burger buns.","Spread sauce on the buns. Add lettuce, tomato, the cheesy patty and the top bun.","Serve immediately with your favorite side."]},
{id:4,name:"Creamy Tomato Gnocchi",category:"Quick meals",time:15,base:2,emoji:"🍅",color:"#f4ddd8",description:"Soft gnocchi in a rich tomato and cream sauce.",ingredients:[["Potato gnocchi",400,"g"],["Passata",250,"ml"],["Cooking cream",100,"ml"],["Mozzarella",125,"g"],["Garlic cloves",2,""],["Olive oil",1,"tbsp"],["Italian herbs",1,"tsp"]],steps:["Heat the olive oil in a pan and cook the minced garlic for 30 seconds.","Add the passata and Italian herbs. Simmer for 3 minutes.","Stir in the cooking cream.","Add the gnocchi and cook according to the package instructions, adding a little water if the sauce gets too thick.","Tear the mozzarella into pieces and stir it through until melted.","Season to taste and serve warm."]},
{id:5,name:"Peanut Butter Banana Oats",category:"Breakfast",time:8,base:1,emoji:"🥣",color:"#eee4c8",description:"A quick, filling breakfast with oats and banana.",ingredients:[["Rolled oats",80,"g"],["Milk",250,"ml"],["Banana",1,""],["Peanut butter",20,"g"],["Cinnamon",1,"pinch"]],steps:["Add the oats and milk to a small saucepan.","Cook over medium-low heat for 4–6 minutes, stirring regularly.","Slice the banana.","Transfer oats to a bowl and top with banana, peanut butter and cinnamon."]},
{id:6,name:"Cheesy Quesadillas",category:"Quick meals",time:15,base:2,emoji:"🌮",color:"#f3e1c7",description:"Crispy tortillas filled with melted cheese and chicken.",ingredients:[["Tortillas",4,""],["Cooked chicken",200,"g"],["Grated cheese",150,"g"],["Sour cream",60,"g"],["Bell pepper",1,""],["Paprika",1,"tsp"]],steps:["Slice the cooked chicken and bell pepper thinly.","Mix the chicken with paprika.","Add cheese, chicken and pepper to one half of each tortilla, then fold over.","Toast in a lightly oiled pan for 2–3 minutes per side until crisp and the cheese melts.","Slice into wedges and serve with sour cream."]}
];
let state={favorites:[],shopping:[],servings:{},checkedSteps:{},checkedIngredients:{},budgetLimit:25000,ingredientPrices:{},weeklySpending:[],priceEdited:{}};
try{state={...state,...JSON.parse(localStorage.getItem("pantryPalState")||"{}")}}catch(e){}
let tab="recipes",selected=null,query="",category="All",favoritesOnly=false;
function save(){localStorage.setItem("pantryPalState",JSON.stringify(state));updateCount()}
function updateCount(){document.getElementById("shopCount").textContent=state.shopping.length?`(${state.shopping.filter(x=>!x.done).length})`:""}
function showTab(t){tab=t;selected=null;document.getElementById("recipesTab").classList.toggle("active",t==="recipes");document.getElementById("shoppingTab").classList.toggle("active",t==="shopping");document.getElementById("budgetTab").classList.toggle("active",t==="budget");document.getElementById("heroTitle").textContent=t==="shopping"?"Your shopping list":t==="budget"?"Your food budget":"What are we cooking?";document.getElementById("heroSub").textContent=t==="shopping"?"Everything you need, all in one place.":t==="budget"?"Estimated costs and real spending in Ft.":"Find your next favorite meal.";render()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function qty(n){return Number.isInteger(n)?String(n):String(Number(n.toFixed(2)))}
function amount(ing,r){let n=ing[1]*(state.servings[r.id]||r.base)/r.base;return `${qty(n)}${ing[2]?" "+ing[2]:""} ${ing[0]}`}
function render(){updateCount();let el=document.getElementById("app");if(tab==="shopping"){renderShopping(el);return}if(tab==="budget"){renderBudget(el);return}if(selected){renderDetail(el);return}
let list=recipes.filter(r=>(r.name+" "+r.description+" "+r.ingredients.map(i=>i[0]).join(" ")).toLowerCase().includes(query.toLowerCase())&&(category==="All"||r.category===category)&&(!favoritesOnly||state.favorites.includes(r.id)));
el.innerHTML=`<div class="search">⌕ <input value="${esc(query)}" placeholder="Search meals or ingredients..." oninput="query=this.value;render()"><button class="xbtn" onclick="query='';render()">×</button></div><div class="chips">${["All","Breakfast","Lunch","Dinner","Quick meals"].map(c=>`<button class="chip ${category===c?"active":""}" onclick="category='${c}';render()">${c}</button>`).join("")}<button class="chip ${favoritesOnly?"active":""}" onclick="favoritesOnly=!favoritesOnly;render()">♥ Favorites</button></div><div class="section-title"><h3>${favoritesOnly?"Your favorites":"Easy everyday meals"}</h3><span class="muted">${list.length} recipes</span></div>${list.length?`<div class="grid">${list.map(r=>`<article class="card"><div class="food-art" style="background:${r.color}">${r.emoji}</div><div class="card-body"><h3>${r.name}</h3><div class="meta"><span>◷ ${r.time} min</span><span class="money">${money(recipeCost(r)/(r.base||1))}/serv.</span><button class="heart" aria-label="Favorite" onclick="toggleFavorite(${r.id})">${state.favorites.includes(r.id)?"♥":"♡"}</button></div><button class="btn full" onclick="openRecipe(${r.id})">View recipe</button></div></article>`).join("")}</div>`:`<div class="empty"><div class="big">🔎</div><b>No recipes found</b><p>Try another search or show all recipes.</p><button class="btn secondary" onclick="query='';category='All';favoritesOnly=false;render()">Show all recipes</button></div>`}<div class="source">PANTRY PAL · Simple meals, smarter shopping<br><button class="btn secondary" style="margin-top:10px" onclick="installApp()">＋ Install Pantry Pal</button></div>`}
function toggleFavorite(id){state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();render()}
function openRecipe(id){selected=recipes.find(r=>r.id===id);state.servings[id]=state.servings[id]||selected.base;render()}
function renderDetail(el){let r=selected,s=state.servings[r.id]||r.base,done=state.checkedSteps[r.id]||[];el.innerHTML=`<button class="back" onclick="selected=null;render()">← Back to recipes</button><div class="detail-art" style="background:${r.color}"><div class="emoji">${r.emoji}</div><h2>${r.name}</h2><p>${r.description}</p><p style="margin-top:10px">◷ ${r.time} min &nbsp; · &nbsp; ♙ ${s} servings</p></div><section class="panel"><div class="section-title"><h3>Estimated recipe cost</h3><span class="money">${money(recipeCost(r))}</span></div><p class="smallnote">Estimates only; adjust ingredient prices in Budget. Actual store prices may differ.</p></section><section class="panel"><div class="section-title"><h3>Ingredients</h3><div class="serving"><button onclick="setServings(${r.id},-1)">−</button><b>${s}</b><button onclick="setServings(${r.id},1)">+</button></div></div><p class="muted">Quantities update when you change servings.</p>${r.ingredients.map((ing,i)=>`<div class="ingredient"><input type="checkbox" ${((state.checkedIngredients[r.id]||[]).includes(i))?"checked":""} onchange="toggleIngredient(${r.id},${i})"><label>${amount(ing,r)}</label></div>`).join("")}<button class="btn full" style="margin-top:14px" onclick="addRecipe(${r.id})">＋ Add ingredients to shopping list</button></section><section class="panel"><div class="section-title"><h3>How to make it</h3><span class="muted">${done.length}/${r.steps.length}</span></div>${r.steps.map((step,i)=>`<div class="steps ${done.includes(i)?"done":""}" onclick="toggleStep(${r.id},${i})"><div class="stepnum">${done.includes(i)?"✓":i+1}</div><p>${step}</p></div>`).join("")}<button class="btn secondary full" onclick="state.checkedSteps[${r.id}]=[];save();render()">Reset cooking steps</button></section><button class="btn secondary full" onclick="toggleFavorite(${r.id})">${state.favorites.includes(r.id)?"♥ Remove from favorites":"♡ Save to favorites"}</button>`}
function setServings(id,d){state.servings[id]=Math.max(1,Math.min(20,(state.servings[id]||2)+d));save();render()}
function toggleStep(id,i){let a=state.checkedSteps[id]||[];state.checkedSteps[id]=a.includes(i)?a.filter(x=>x!==i):[...a,i];save();render()}
function toggleIngredient(id,i){let a=state.checkedIngredients[id]||[];state.checkedIngredients[id]=a.includes(i)?a.filter(x=>x!==i):[...a,i];save();render()}
function addRecipe(id){let r=recipes.find(x=>x.id===id);r.ingredients.forEach(ing=>{let label=amount(ing,r);if(!state.shopping.some(x=>x.label===label))state.shopping.push({label,done:false,recipe:r.name})});save();showTab("shopping")}
function addManual(){let input=document.getElementById("newItem"),v=input.value.trim();if(!v)return;state.shopping.push({label:v,done:false,recipe:"Added manually"});save();render()}

function money(n){return Math.round(Number(n)||0).toLocaleString("hu-HU")+" Ft"}
function defaultPrice(name){
 const k=name.toLowerCase();
 const p=[["chicken breast",2400],["pasta",700],["cooking cream",950],["parmesan",650],["garlic",120],["butter",600],["salt and pepper",100],["rice",700],["grated cheese",900],["chicken stock",250],["onion",120],["cooking oil",150],["ground beef",2200],["burger buns",500],["cheddar cheese",800],["lettuce",350],["tomato",500],["burger sauce",600],["potato gnocchi",900],["passata",500],["mozzarella",650],["olive oil",250],["italian herbs",100],["rolled oats",300],["milk",400],["banana",180],["peanut butter",500],["cinnamon",80],["tortillas",700],["cooked chicken",1600],["sour cream",350],["bell pepper",450],["paprika",80]];
 const found=p.find(x=>k.includes(x[0]));return found?found[1]:300;
}
function priceFor(ing){return Number(state.ingredientPrices[ing[0]]??defaultPrice(ing[0]))}
function recipeCost(r){return r.ingredients.reduce((sum,ing)=>sum+priceFor(ing)*(ing[1]*(state.servings[r.id]||r.base)/r.base),0)}
function weekSpend(){let now=new Date();let monday=new Date(now);monday.setHours(0,0,0,0);monday.setDate(monday.getDate()-((monday.getDay()+6)%7));return (state.weeklySpending||[]).filter(x=>new Date(x.date)>=monday).reduce((s,x)=>s+Number(x.amount||0),0)}
function renderBudget(el){
 let total=weekSpend(),limit=Number(state.budgetLimit)||0,remaining=limit-total,spent=(state.weeklySpending||[]);
 el.innerHTML=`<section class="panel" style="background:var(--sage)"><h3>💰 Weekly food budget</h3><label class="muted" for="budgetLimit">Your weekly budget (Ft)</label><div class="addrow"><input id="budgetLimit" type="number" min="0" step="500" value="${limit}" onchange="state.budgetLimit=Math.max(0,Number(this.value)||0);save();render()"><button class="btn" onclick="state.budgetLimit=Math.max(0,Number(document.getElementById('budgetLimit').value)||0);save();render()">Save</button></div><div class="budget-grid"><div class="stat"><span class="muted">Recorded spending</span><b>${money(total)}</b></div><div class="stat"><span class="muted">Budget remaining</span><b style="color:${remaining<0?"#b34132":"var(--green2)"}">${money(remaining)}</b></div></div><div class="progress"><span style="width:${limit?Math.min(100,total/limit*100):0}%;background:${remaining<0?"#b34132":"var(--green2)"}"></span></div><p class="smallnote">Only purchases you record count as actual spending. Recipe costs below are estimates.</p></section><section class="panel"><h3>Ingredient price estimates</h3><p class="muted">Edit the estimated cost per recipe ingredient quantity unit (e.g. price for 300 g chicken, 200 ml cream, or 1 onion). These are rough starter estimates, not live store prices.</p>${[...new Map(recipes.flatMap(r=>r.ingredients.map(i=>[i[0],i]))).values()].map(ing=>`<div class="price-row"><label>${esc(ing[0])}<div class="smallnote">per recipe quantity</div></label><input class="price-input" type="number" min="0" step="10" value="${priceFor(ing)}" onchange="state.ingredientPrices['${esc(ing[0]).replace(/'/g,"\\'")}']=Math.max(0,Number(this.value)||0);save();render()"><span class="muted">Ft</span></div>`).join("")}</section><section class="panel"><h3>Record a purchase</h3><p class="muted">Record the actual amount you spent on groceries.</p><form class="addrow" onsubmit="event.preventDefault();recordSpend()"><input id="spendName" placeholder="e.g. Weekly groceries" required><input id="spendAmount" type="number" min="1" placeholder="Ft" required style="width:100px;flex:0 0 100px"><button class="btn">Add</button></form>${spent.length?spent.slice().reverse().map((x,ri)=>`<div class="price-row"><label>${esc(x.name)}<div class="smallnote">${new Date(x.date).toLocaleDateString("hu-HU")}</div></label><b class="money">${money(x.amount)}</b><button class="xbtn" onclick="state.weeklySpending.splice(${spent.length-1-ri},1);save();render()">×</button></div>`).join(""):`<p class="muted">No purchases recorded yet.</p>`}</section>`;
}
function recordSpend(){let name=document.getElementById("spendName").value.trim(),amount=Number(document.getElementById("spendAmount").value);if(!name||amount<=0)return;(state.weeklySpending||(state.weeklySpending=[])).push({name,amount,date:new Date().toISOString()});save();render()}

function renderShopping(el){let bought=state.shopping.filter(x=>x.done).length,progress=state.shopping.length?bought/state.shopping.length*100:0;el.innerHTML=`<section class="panel" style="background:var(--sage)"><h3>🛒 Shopping checklist</h3><div class="muted">${bought} of ${state.shopping.length} items collected</div><div class="progress"><span style="width:${progress}%"></span></div></section><form class="addrow" onsubmit="event.preventDefault();addManual()"><input id="newItem" placeholder="Add milk, bread, etc."><button class="btn">＋ Add</button></form>${state.shopping.length?`<div class="section-title"><h3>Things to buy</h3><button class="xbtn" onclick="state.shopping=state.shopping.filter(x=>!x.done);save();render()">Clear bought</button></div>${state.shopping.map((x,i)=>`<div class="shoprow ${x.done?"done":""}"><input type="checkbox" ${x.done?"checked":""} onchange="state.shopping[${i}].done=this.checked;save();render()"><label>${esc(x.label)}</label><button class="xbtn" onclick="state.shopping.splice(${i},1);save();render()">×</button></div>`).join("")}<button class="btn secondary full" onclick="copyList()">▣ Copy shopping list</button><button class="btn danger full" style="margin-top:8px" onclick="if(confirm('Clear the entire shopping list?')){state.shopping=[];save();render()}">Clear entire list</button>`:`<div class="empty"><div class="big">🧺</div><b>Your list is empty</b><p>Open a recipe and tap “Add ingredients to shopping list” to get started.</p><button class="btn" onclick="showTab('recipes')">Explore recipes</button></div>`}`}
function copyList(){let txt=state.shopping.map(x=>`${x.done?"[x]":"[ ]"} ${x.label}`).join("\n");if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>alert("Shopping list copied!")).catch(()=>prompt("Copy your shopping list:",txt));else prompt("Copy your shopping list:",txt)}
render();save();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
let deferredInstall=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;const b=document.getElementById("installBtn");if(b)b.hidden=false;});
function installApp(){if(deferredInstall){deferredInstall.prompt();deferredInstall=null}else alert("In Chrome on Android: tap ⋮ → Add to Home screen (or Install app).")}
</script>
</body></html>
